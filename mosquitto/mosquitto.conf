persistence false
log_dest stdout
per_listener_settings false

# Stay as root so bind-mounted certs are readable on Docker Desktop (dev).
user root

# Device-facing TLS listener (devices connect here over MQTTS).
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# Internal listener (backend on the Docker network / local dev tooling).
listener 1883

allow_anonymous false

# ---------------------------------------------------------------------------
# mosquitto-go-auth: Postgres is the single source of truth.
#   - IoT devices authenticate against the devices table.
#   - Service accounts (the backend) live in mqtt_service_accounts; the backend
#     is a superuser and bypasses the per-device ACLs.
# ---------------------------------------------------------------------------
auth_plugin /mosquitto/go-auth.so
auth_opt_backends postgres
auth_opt_hasher bcrypt
auth_opt_log_level info

auth_opt_pg_host postgres
auth_opt_pg_port 5432
auth_opt_pg_dbname vleefruit
auth_opt_pg_user vleefruit
auth_opt_pg_password vleefruit
auth_opt_pg_sslmode disable

# userquery: return the bcrypt hash for either a device or a service account.
auth_opt_pg_userquery SELECT key_hash FROM (SELECT device_id AS username, key_hash FROM devices WHERE status = 'active' UNION ALL SELECT username, password_hash AS key_hash FROM mqtt_service_accounts) u WHERE u.username = $1 LIMIT 1

# superquery: service accounts flagged superuser bypass ACL checks.
auth_opt_pg_superquery SELECT COUNT(*) FROM mqtt_service_accounts WHERE username = $1 AND superuser = true

# aclquery: devices are scoped to their own subtree via %u substitution.
#   acc: 1=read, 2=write, 3=readwrite, 4=subscribe
auth_opt_pg_aclquery SELECT topic FROM (SELECT 'devices/'||$1||'/images' AS topic, 2 AS rw UNION ALL SELECT 'devices/'||$1||'/readings', 2 UNION ALL SELECT 'devices/'||$1||'/results', 1) t WHERE t.rw = $2 OR (t.rw = 1 AND $2 = 4)
