services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vleefruit-backend:latest
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      # App environment + logging (development=text logs, production=JSON logs)
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Postgres (matches gorm.io/driver/postgres DSN pieces)
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-vleefruit}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vleefruit}
      DB_NAME: ${POSTGRES_DB:-vleefruit}
      DB_SSLMODE: disable
      DATABASE_URL: postgres://${POSTGRES_USER:-vleefruit}:${POSTGRES_PASSWORD:-vleefruit}@postgres:5432/${POSTGRES_DB:-vleefruit}?sslmode=disable
      # Redis (matches redis/go-redis)
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      # Object storage (S3-compatible: MinIO locally, swap for R2 in prod)
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-fruit-images}
      S3_USE_SSL: "false"
      S3_FORCE_PATH_STYLE: "true"
      # MQTT (backend connects to Mosquitto over TLS as the privileged account)
      MQTT_BROKER_URL: tls://mosquitto:8883
      MQTT_CLIENT_ID: vleefruit-backend
      MQTT_USERNAME: backend
      MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD:-backend-dev-secret}
      MQTT_TLS_CA: /certs/ca.crt
      # Admin bearer token for the management REST API
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    volumes:
      - ./mosquitto/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - vleefruit

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vleefruit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vleefruit}
      POSTGRES_DB: ${POSTGRES_DB:-vleefruit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vleefruit} -d ${POSTGRES_DB:-vleefruit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vleefruit

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vleefruit

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"      # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vleefruit

  mosquitto:
    image: iegomez/mosquitto-go-auth:latest
    restart: unless-stopped
    ports:
      - "${MQTT_TLS_PORT:-8883}:8883"   # device-facing TLS
      - "${MQTT_PORT:-1883}:1883"       # internal / dev tooling
    volumes:
      - ./mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vleefruit

  # Adminer: lightweight web UI for inspecting Postgres during development.
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vleefruit

  # One-shot: waits for MinIO, then creates the bucket if it does not exist.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-fruit-images} &&
      echo 'Bucket ${S3_BUCKET:-fruit-images} ready';
      "
    restart: "no"
    networks:
      - vleefruit

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  vleefruit:
    driver: bridge
