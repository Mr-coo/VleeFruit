services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        ORT_VERSION: ${ORT_VERSION:-1.20.1}
    image: vleefruit-backend:latest
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      # Mount your exported model here; MODEL_PATH points at it below.
      - ./backend/models:/app/models:ro
    environment:
      # AI model (in-process ONNX). libonnxruntime.so path is baked into the image.
      MODEL_PATH: ${MODEL_PATH:-/app/models/model.onnx}
      MODEL_INPUT_NAME: ${MODEL_INPUT_NAME:-images}
      MODEL_OUTPUT_NAME: ${MODEL_OUTPUT_NAME:-output0}
      MODEL_INPUT_SIZE: ${MODEL_INPUT_SIZE:-640}
      # Vision LLM (Google Gemini) for POST /api/v1/images.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      GEMINI_PROMPT: ${GEMINI_PROMPT:-}
      # MQTT layer (runs alongside the HTTP server). Points at the local broker
      # below by default; set MQTT_BROKER_URL empty to disable.
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-tcp://mqtt:1883}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-vleefruit-backend}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_REQUEST_TOPIC: ${MQTT_REQUEST_TOPIC:-vleefruit/request}
      MQTT_RESPONSE_TOPIC: ${MQTT_RESPONSE_TOPIC:-vleefruit/response}
      MQTT_IMAGE_REQUEST_TOPIC: ${MQTT_IMAGE_REQUEST_TOPIC:-vleefruit/image/request}
      MQTT_IMAGE_RESPONSE_TOPIC: ${MQTT_IMAGE_RESPONSE_TOPIC:-vleefruit/image/response}
      MQTT_QOS: ${MQTT_QOS:-0}
    depends_on:
      mqtt:
        condition: service_healthy
    networks:
      - vleefruit

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    # Generates the password/ACL files from the env below, then starts the
    # broker. Anonymous access is disabled (see mqtt/mosquitto.conf).
    entrypoint: ["/bin/sh", "/mosquitto/entrypoint.sh"]
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_DEVICE_USERNAME: ${MQTT_DEVICE_USERNAME:-}
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD:-}
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mqtt/entrypoint.sh:/mosquitto/entrypoint.sh:ro
      - mqtt_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -u \"$$MQTT_USERNAME\" -P \"$$MQTT_PASSWORD\" -t '$$SYS/#' -C 1 -W 3 -q 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vleefruit

volumes:
  mqtt_data:

networks:
  vleefruit:
    driver: bridge
