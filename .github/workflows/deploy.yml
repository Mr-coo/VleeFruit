name: Deploy

# Deploys by SSHing into the VPS, checking out the tested commit, pulling the
# backend image CI built for it from GHCR, and restarting the stack with docker
# compose. Nothing is compiled on the VPS (it runs out of memory building the
# backend). Runs only after the CI workflow succeeds for a push to main
# (typically a merged PR), so a failing build/test never deploys. Can also be
# triggered manually from the Actions tab (deploys the current origin/main).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST     - server hostname or IP
#   VPS_USER     - SSH user (must be able to run docker)
#   VPS_SSH_KEY  - private key for that user (the matching public key is in
#                  the server's ~/.ssh/authorized_keys)
#   VPS_APP_DIR  - absolute path to the cloned repo on the VPS
#   MQTT_USERNAME / MQTT_PASSWORD               - backend broker login
#   MQTT_DEVICE_USERNAME / MQTT_DEVICE_PASSWORD - device broker login
#                  (the broker rejects anonymous clients and fails to start
#                  without these; they override any values in the VPS .env)
# Optional:
#   VPS_PORT     - SSH port (defaults to 22)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read
  # Lets the job token pull the backend image from GHCR on the VPS.
  packages: read

jobs:
  deploy:
    name: Pull & restart on VPS
    runs-on: ubuntu-latest
    # Skip when CI failed/was cancelled, and ignore CI runs from PRs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    env:
      # The exact commit CI tested; empty on manual runs (deploy origin/main).
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
      MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
      MQTT_DEVICE_USERNAME: ${{ secrets.MQTT_DEVICE_USERNAME }}
      MQTT_DEVICE_PASSWORD: ${{ secrets.MQTT_DEVICE_PASSWORD }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          envs: DEPLOY_SHA,GHCR_USER,GHCR_TOKEN,MQTT_USERNAME,MQTT_PASSWORD,MQTT_DEVICE_USERNAME,MQTT_DEVICE_PASSWORD
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"
            # Sync working tree to the commit CI tested (compose file, broker
            # config). Untracked files (./backend/models, .env) are preserved.
            git fetch --prune origin main
            git reset --hard "${DEPLOY_SHA:-origin/main}"
            # Run the image CI built and pushed for this exact commit.
            export BACKEND_IMAGE="ghcr.io/mr-coo/vleefruit-backend:$(git rev-parse HEAD)"
            # Broker credentials come from Actions secrets; exported shell
            # vars take precedence over .env in docker compose.
            export MQTT_USERNAME MQTT_PASSWORD MQTT_DEVICE_USERNAME MQTT_DEVICE_PASSWORD
            # The job token only lives for this run; don't leave it behind.
            trap 'docker logout ghcr.io >/dev/null' EXIT
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull backend
            docker compose up -d --no-build --remove-orphans
            # Drop images no container uses (previous backend versions).
            docker image prune -af
            docker compose ps
