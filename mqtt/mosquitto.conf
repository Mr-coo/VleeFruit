# Mosquitto broker config. Anonymous access is disabled: clients must log in
# with a user from the password file, and the ACL limits what each user may
# publish/subscribe. Both files are generated at container start by
# mqtt/entrypoint.sh from the MQTT_* environment variables.
listener 1883
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
